[package]
name = "scadline"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.23"
eframe = "0.31"
git2 = { version = "0.21", features = ["vendored-libgit2"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
stl_io = "0.8"
tempfile = "3"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
